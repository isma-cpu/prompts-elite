    <div id="confirmModal" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" aria-hidden="true">
        <div id="confirmModalContent" class="elite-panel gold-shadow w-full max-w-sm rounded-2xl p-6 transform scale-95 transition-transform duration-300"
             role="alertdialog" aria-modal="true" aria-labelledby="confirmModalMessage">

    <div id="toastRegion" aria-live="polite" aria-atomic="false"></div>

    <script>
    (function () {
        'use strict';

        /* =========================================================
         * UTILIDADES
         * ========================================================= */
        function uid() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        }

        const Sanitizer = {
            // Defensa en profundidad: el DOM siempre se construye vía textContent/.value
            // (nunca innerHTML con datos de usuario), pero además normalizamos la entrada
            // para eliminar caracteres de control y limitar longitud antes de persistir.
            cleanText(str, maxLen) {
                if (typeof str !== 'string') return '';
                const stripped = str.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                return stripped.slice(0, maxLen || 4000);
            }
        };

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }

        function el(tag, attrs, children) {
            const node = document.createElement(tag);
            attrs = attrs || {};
            for (const key in attrs) {
                if (!Object.prototype.hasOwnProperty.call(attrs, key)) continue;
                const value = attrs[key];
                if (value === undefined || value === null || value === false) continue;
                if (key === 'class') node.className = value;
                else if (key === 'text') node.textContent = value;
                else if (key.indexOf('on') === 0 && typeof value === 'function') node.addEventListener(key.slice(2), value);
                else node.setAttribute(key, value === true ? '' : String(value));
            }
            (children || []).forEach(child => {
                if (child === null || child === undefined) return;
                node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
            });
            return node;
        }

        const BLOCK_DEFAULT_EMOJI = '🗂️';
        const PROMPT_DEFAULT_EMOJI = '📝';
        const NOTE_DEFAULT_EMOJI = '🗒️';
        const EMOJI_CHOICES = [
            '🚀','🎯','💡','🔥','⚡','🧠','🤖','📁','📝','✨','👑','💎','🎨','📊','🔒','🌐',
            '💬','🖼️','🎬','📌','🏆','⭐','🔧','🧩','📚','💰','🕹️','🛠️','🎭','🧪','🔬','📡',
            '🎧','🎥','🖊️','📎','🗂️','🔑','🌟','🪄','🧭','🎪','🛡️','🌙','☀️','🔮','🧿','⚗️',
            '🎲','🧵','🖇️','🛰️','🌌','⚙️','🧬','🎓','🗝️','🕶️','🎼','🧨','🍀','🧊','🕸️','🦾'
        ];

        /* =========================================================
         * TOASTS (reemplazo accesible de alert())
         * ========================================================= */
        const Toast = {
            region: document.getElementById('toastRegion'),
            show(message, type) {
                const node = el('div', { class: 'toast' + (type === 'error' ? ' error' : ''), role: 'status' }, [message]);
                this.region.appendChild(node);
                setTimeout(() => {
                    node.style.transition = 'opacity 0.3s ease';
                    node.style.opacity = '0';
                    setTimeout(() => node.remove(), 300);
                }, 3200);
            }
        };

        /* =========================================================
         * CAPA DE DATOS: IndexedDB (asíncrona, basada en promesas)
         * ========================================================= */
        const DB_NAME = 'ElitePromptManagerDB';
        const DB_VERSION = 1;
        const STORE_DATA = 'appData';
        const STORE_MEDIA = 'media';
        const ROOT_KEY = 'root';

        class Database {
            constructor() { this._dbPromise = null; }

            open() {
                if (this._dbPromise) return this._dbPromise;
                this._dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_DATA)) {
                            db.createObjectStore(STORE_DATA, { keyPath: 'key' });
                        }
                        if (!db.objectStoreNames.contains(STORE_MEDIA)) {
                            db.createObjectStore(STORE_MEDIA, { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error);
                });
                return this._dbPromise;
            }

            async _store(storeName, mode) {
                const db = await this.open();
                return db.transaction(storeName, mode).objectStore(storeName);
            }

            async getRoot() {
                const store = await this._store(STORE_DATA, 'readonly');
                return new Promise((resolve, reject) => {
                    const req = store.get(ROOT_KEY);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                    req.onerror = () => reject(req.error);
                });
            }

            async saveRoot(value) {
                const store = await this._store(STORE_DATA, 'readwrite');
                return new Promise((resolve, reject) => {
                    const req = store.put({ key: ROOT_KEY, value });
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }

            async putMedia(id, blob, mimeType) {
                const store = await this._store(STORE_MEDIA, 'readwrite');
                return new Promise((resolve, reject) => {
                    const req = store.put({ id, blob, mimeType });
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }

            async getMedia(id) {
                const store = await this._store(STORE_MEDIA, 'readonly');
                return new Promise((resolve, reject) => {
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            }

            async deleteMedia(id) {
                const store = await this._store(STORE_MEDIA, 'readwrite');
                return new Promise((resolve, reject) => {
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }
        }

        /* =========================================================
         * GESTOR DE URLs DE MULTIMEDIA (Blob -> ObjectURL, con liberación)
         * ========================================================= */
        class MediaUrlManager {
            constructor(db) { this.db = db; this.cache = new Map(); this.pending = new Map(); }

            getUrl(mediaId) {
                if (!mediaId) return Promise.resolve(null);
                if (this.cache.has(mediaId)) return Promise.resolve(this.cache.get(mediaId));
                if (this.pending.has(mediaId)) return this.pending.get(mediaId);
                const promise = (async () => {
                    const rec = await this.db.getMedia(mediaId);
                    this.pending.delete(mediaId);
                    if (!rec) return null;
                    const url = URL.createObjectURL(rec.blob);
                    this.cache.set(mediaId, url);
                    return url;
                })();
                this.pending.set(mediaId, promise);
                return promise;
            }

            revoke(mediaId) {
                const url = this.cache.get(mediaId);
                if (url) { URL.revokeObjectURL(url); this.cache.delete(mediaId); }
            }

            revokeAll() {
                for (const [id] of this.cache) this.revoke(id);
            }
        }

        /* =========================================================
         * CONVERSIÓN LEGADO (localStorage / backups antiguos, con o sin carpetas)
         * ========================================================= */
        async function convertMediaDataUrl(dataUrl, db) {
            if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return null;
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                const id = uid();
                const type = blob.type.startsWith('video') ? 'video' : 'image';
                await db.putMedia(id, blob, blob.type);
                return { id, type };
            } catch (err) { return null; }
        }

        async function convertLegacyPrompt(rawPrompt, db) {
            const newPrompt = {
                id: uid(),
                title: Sanitizer.cleanText(rawPrompt.title || '', 150),
                emoji: typeof rawPrompt.emoji === 'string' ? rawPrompt.emoji : '',
                text: Sanitizer.cleanText(rawPrompt.text || '', 20000),
                description: Sanitizer.cleanText(rawPrompt.description || '', 300),
                mediaBeforeId: null, mediaBeforeType: null,
                mediaAfterId: null, mediaAfterType: null,
                coverMode: (rawPrompt.coverMode === 'after' || rawPrompt.coverMode === 'custom') ? rawPrompt.coverMode : 'emoji',
                coverMediaId: null, coverMediaType: null
            };
            if (rawPrompt.mediaBefore || rawPrompt.mediaAfter) {
                if (rawPrompt.mediaBefore) {
                    const r = await convertMediaDataUrl(rawPrompt.mediaBefore, db);
                    if (r) { newPrompt.mediaBeforeId = r.id; newPrompt.mediaBeforeType = r.type; }
                }
                if (rawPrompt.mediaAfter) {
                    const r = await convertMediaDataUrl(rawPrompt.mediaAfter, db);
                    if (r) { newPrompt.mediaAfterId = r.id; newPrompt.mediaAfterType = r.type; }
                }
            } else if (rawPrompt.media) {
                // Backup antiguo con un único archivo: se coloca en la casilla "Antes".
                const r = await convertMediaDataUrl(rawPrompt.media, db);
                if (r) { newPrompt.mediaBeforeId = r.id; newPrompt.mediaBeforeType = r.type; }
            }
            if (rawPrompt.coverImage) {
                const r = await convertMediaDataUrl(rawPrompt.coverImage, db);
                if (r) { newPrompt.coverMediaId = r.id; newPrompt.coverMediaType = r.type; }
                else newPrompt.coverMode = 'emoji';
            } else if (newPrompt.coverMode === 'custom') {
                newPrompt.coverMode = 'emoji';
            }
            return newPrompt;
        }

        async function convertLegacyBlocks(legacyArray, db) {
            const result = [];
            for (const rawBlock of legacyArray) {
                const newBlock = {
                    id: uid(),
                    name: Sanitizer.cleanText(rawBlock.name || '', 120),
                    emoji: typeof rawBlock.emoji === 'string' ? rawBlock.emoji : '',
                    description: Sanitizer.cleanText(rawBlock.description || '', 400),
                    prompts: []
                };
                const rawPrompts = [];
                if (Array.isArray(rawBlock.prompts)) {
                    rawPrompts.push(...rawBlock.prompts);
                } else if (Array.isArray(rawBlock.folders)) {
                    // Formato antiguo con carpetas: se aplanan sus prompts directamente en el bloque.
                    for (const folder of rawBlock.folders) {
                        if (Array.isArray(folder.prompts)) rawPrompts.push(...folder.prompts);
                    }
                }
                for (const rawPrompt of rawPrompts) {
                    newBlock.prompts.push(await convertLegacyPrompt(rawPrompt, db));
                }
                result.push(newBlock);
            }
            return result;
        }

        // Migra en memoria (sin tocar los blobs, que ya viven en el store 'media') la forma
        // antigua bloques→carpetas→prompts a la nueva bloques→prompts, para datos que ya
        // estaban guardados en IndexedDB antes de esta versión.
        function migrateBlockShapeInPlace(rawBlock) {
            if (Array.isArray(rawBlock.prompts)) {
                return {
                    id: rawBlock.id || uid(),
                    name: rawBlock.name || '',
                    emoji: rawBlock.emoji || '',
                    description: rawBlock.description || '',
                    prompts: rawBlock.prompts.map(migratePromptShapeInPlace)
                };
            }
            const prompts = [];
            (rawBlock.folders || []).forEach(folder => {
                (folder.prompts || []).forEach(p => prompts.push(migratePromptShapeInPlace(p)));
            });
            return { id: rawBlock.id || uid(), name: rawBlock.name || '', emoji: rawBlock.emoji || '', description: '', prompts };
        }

        function migratePromptShapeInPlace(p) {
            if ('mediaBeforeId' in p || 'mediaAfterId' in p) {
                return {
                    id: p.id || uid(), title: p.title || '', emoji: p.emoji || '', text: p.text || '', description: p.description || '',
                    mediaBeforeId: p.mediaBeforeId || null, mediaBeforeType: p.mediaBeforeType || null,
                    mediaAfterId: p.mediaAfterId || null, mediaAfterType: p.mediaAfterType || null,
                    coverMode: p.coverMode || 'emoji', coverMediaId: p.coverMediaId || null, coverMediaType: p.coverMediaType || null
                };
            }
            return {
                id: p.id || uid(), title: p.title || '', emoji: p.emoji || '', text: p.text || '', description: p.description || '',
                mediaBeforeId: p.mediaId || null, mediaBeforeType: p.mediaType || null,
                mediaAfterId: null, mediaAfterType: null,
                coverMode: 'emoji', coverMediaId: null, coverMediaType: null
            };
        }

        /* =========================================================
         * CAPA DE ESTADO (Modelo)
         * ========================================================= */
        class PromptStore extends EventTarget {
            constructor(db, mediaUrlManager) {
                super();
                this.db = db;
                this.mediaUrlManager = mediaUrlManager;
                this.blocks = [];
                this.notes = [];
            }

            async load() {
                const migrated = await this._migrateFromLocalStorageIfNeeded();
                if (!migrated) {
                    const root = await this.db.getRoot();
                    const rawBlocks = (root && Array.isArray(root.blocks)) ? root.blocks : [];
                    this.notes = (root && Array.isArray(root.notes)) ? root.notes : [];
                    let shapeChanged = false;
                    this.blocks = rawBlocks.map(b => {
                        if (Array.isArray(b.prompts) && 'description' in b) return b;
                        shapeChanged = true;
                        return migrateBlockShapeInPlace(b);
                    });
                    if (shapeChanged && this.blocks.length) await this.persist();
                }
            }

            async _migrateFromLocalStorageIfNeeded() {
                try {
                    const existingRoot = await this.db.getRoot();
                    if (existingRoot) return false;
                    const raw = localStorage.getItem('elite_prompts_db');
                    if (!raw) return false;
                    const legacy = JSON.parse(raw);
                    if (!Array.isArray(legacy)) return false;
                    this.blocks = await convertLegacyBlocks(legacy, this.db);
                    await this.persist();
                    localStorage.removeItem('elite_prompts_db');
                    return true;
                } catch (err) {
                    console.error('Error de migración desde localStorage', err);
                    return false;
                }
            }

            async persist() {
                await this.db.saveRoot({ blocks: this.blocks, notes: this.notes });
                this.dispatchEvent(new CustomEvent('saved'));
            }

            _emit() { this.dispatchEvent(new CustomEvent('change')); }

            findBlock(blockId) { return this.blocks.find(b => b.id === blockId) || null; }
            findPrompt(blockId, promptId) { const b = this.findBlock(blockId); return b ? (b.prompts.find(p => p.id === promptId) || null) : null; }

            async addBlock() {
                const id = uid();
                this.blocks.push({ id, name: '', emoji: '', description: '', prompts: [] });
                await this.persist(); this._emit();
                return id;
            }

            async addPrompt(blockId) {
                const block = this.findBlock(blockId);
                if (!block) return null;
                const id = uid();
                block.prompts.push({
                    id, title: '', emoji: '', text: '', description: '',
                    mediaBeforeId: null, mediaBeforeType: null, mediaAfterId: null, mediaAfterType: null,
                    coverMode: 'emoji', coverMediaId: null, coverMediaType: null
                });
                await this.persist(); this._emit();
                return id;
            }

            // "emoji" (por defecto), "after" (usa la imagen "Después") o "custom" (una foto propia).
            async setPromptCoverMode(blockId, promptId, mode) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                prompt.coverMode = mode;
                await this.persist(); this._emit();
            }

            async setPromptCoverMedia(blockId, promptId, file) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                if (prompt.coverMediaId) { this.mediaUrlManager.revoke(prompt.coverMediaId); await this.db.deleteMedia(prompt.coverMediaId); }
                const mediaId = uid();
                await this.db.putMedia(mediaId, file, file.type);
                prompt.coverMediaId = mediaId;
                prompt.coverMediaType = file.type.startsWith('video') ? 'video' : 'image';
                prompt.coverMode = 'custom';
                await this.persist(); this._emit();
            }

            async removePromptCoverMedia(blockId, promptId) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt || !prompt.coverMediaId) return;
                this.mediaUrlManager.revoke(prompt.coverMediaId);
                await this.db.deleteMedia(prompt.coverMediaId);
                prompt.coverMediaId = null; prompt.coverMediaType = null;
                if (prompt.coverMode === 'custom') prompt.coverMode = 'emoji';
                await this.persist(); this._emit();
            }

            // A diferencia de los demás campos, el contenido del prompt (título + texto + descripción)
            // no se autoguarda al escribir: solo se persiste cuando el usuario pulsa "Guardar" en la
            // ficha del prompt, así que aquí sí emitimos 'change' (ya no hay foco que proteger).
            async savePromptContent(blockId, promptId, title, text, description) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                prompt.title = Sanitizer.cleanText(title, 150);
                prompt.description = Sanitizer.cleanText(description, 300);
                prompt.text = Sanitizer.cleanText(text, 20000);
                await this.persist(); this._emit();
            }

            async setBlockName(blockId, name) {
                const block = this.findBlock(blockId);
                if (!block) return;
                block.name = Sanitizer.cleanText(name, 120);
                await this.persist();
            }

            async setBlockEmoji(blockId, emoji) {
                const block = this.findBlock(blockId);
                if (!block) return;
                block.emoji = emoji;
                await this.persist(); this._emit();
            }

            async setBlockDescription(blockId, description) {
                const block = this.findBlock(blockId);
                if (!block) return;
                block.description = Sanitizer.cleanText(description, 400);
                await this.persist();
            }

            async setPromptEmoji(blockId, promptId, emoji) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                prompt.emoji = emoji;
                await this.persist(); this._emit();
            }

            async _releaseMediaForPrompt(prompt) {
                if (prompt.mediaBeforeId) { this.mediaUrlManager.revoke(prompt.mediaBeforeId); await this.db.deleteMedia(prompt.mediaBeforeId); }
                if (prompt.mediaAfterId) { this.mediaUrlManager.revoke(prompt.mediaAfterId); await this.db.deleteMedia(prompt.mediaAfterId); }
                if (prompt.coverMediaId) { this.mediaUrlManager.revoke(prompt.coverMediaId); await this.db.deleteMedia(prompt.coverMediaId); }
            }

            async _releaseMediaForBlock(block) {
                for (const p of block.prompts) await this._releaseMediaForPrompt(p);
            }

            async deleteBlock(blockId) {
                const idx = this.blocks.findIndex(b => b.id === blockId);
                if (idx === -1) return;
                const [removed] = this.blocks.splice(idx, 1);
                await this._releaseMediaForBlock(removed);
                await this.persist(); this._emit();
            }

            async deletePrompt(blockId, promptId) {
                const block = this.findBlock(blockId);
                if (!block) return;
                const idx = block.prompts.findIndex(p => p.id === promptId);
                if (idx === -1) return;
                const [removed] = block.prompts.splice(idx, 1);
                await this._releaseMediaForPrompt(removed);
                await this.persist(); this._emit();
            }

            async setMedia(blockId, promptId, slot, file) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                const idField = slot === 'after' ? 'mediaAfterId' : 'mediaBeforeId';
                const typeField = slot === 'after' ? 'mediaAfterType' : 'mediaBeforeType';
                if (prompt[idField]) { this.mediaUrlManager.revoke(prompt[idField]); await this.db.deleteMedia(prompt[idField]); }
                const mediaId = uid();
                await this.db.putMedia(mediaId, file, file.type);
                prompt[idField] = mediaId;
                prompt[typeField] = file.type.startsWith('video') ? 'video' : 'image';
                await this.persist(); this._emit();
            }

            async removeMedia(blockId, promptId, slot) {
                const prompt = this.findPrompt(blockId, promptId);
                if (!prompt) return;
                const idField = slot === 'after' ? 'mediaAfterId' : 'mediaBeforeId';
                const typeField = slot === 'after' ? 'mediaAfterType' : 'mediaBeforeType';
                if (!prompt[idField]) return;
                this.mediaUrlManager.revoke(prompt[idField]);
                await this.db.deleteMedia(prompt[idField]);
                prompt[idField] = null; prompt[typeField] = null;
                await this.persist(); this._emit();
            }

            async moveBlockBy(blockId, delta) {
                const idx = this.blocks.findIndex(b => b.id === blockId);
                if (idx === -1) return;
                const newIdx = idx + delta;
                if (newIdx < 0 || newIdx >= this.blocks.length) return;
                const [item] = this.blocks.splice(idx, 1);
                this.blocks.splice(newIdx, 0, item);
                await this.persist(); this._emit();
            }

            async reorderBlock(blockId, toIndex) {
                const fromIndex = this.blocks.findIndex(b => b.id === blockId);
                if (fromIndex === -1) return;
                const [item] = this.blocks.splice(fromIndex, 1);
                this.blocks.splice(Math.min(toIndex, this.blocks.length), 0, item);
                await this.persist(); this._emit();
            }

            async movePromptBy(blockId, promptId, delta) {
                const block = this.findBlock(blockId);
                if (!block) return;
                const idx = block.prompts.findIndex(p => p.id === promptId);
                if (idx === -1) return;
                const newIdx = idx + delta;
                if (newIdx < 0 || newIdx >= block.prompts.length) return;
                const [item] = block.prompts.splice(idx, 1);
                block.prompts.splice(newIdx, 0, item);
                await this.persist(); this._emit();
            }

            async movePromptToBlock(fromBlockId, promptId, toBlockId) {
                if (fromBlockId === toBlockId) return;
                const fromBlock = this.findBlock(fromBlockId);
                const toBlock = this.findBlock(toBlockId);
                if (!fromBlock || !toBlock) return;
                const idx = fromBlock.prompts.findIndex(p => p.id === promptId);
                if (idx === -1) return;
                const [item] = fromBlock.prompts.splice(idx, 1);
                toBlock.prompts.push(item);
                await this.persist(); this._emit();
            }

            async reorderPrompt(blockId, promptId, toIndex) {
                const block = this.findBlock(blockId);
                if (!block) return;
                const fromIndex = block.prompts.findIndex(p => p.id === promptId);
                if (fromIndex === -1) return;
                const [item] = block.prompts.splice(fromIndex, 1);
                block.prompts.splice(Math.min(toIndex, block.prompts.length), 0, item);
                await this.persist(); this._emit();
            }

            /* ---------- Notas rápidas (título + emoji + descripción, sin más) ---------- */

            findNote(noteId) { return this.notes.find(n => n.id === noteId) || null; }

            async addNote() {
                const id = uid();
                this.notes.push({ id, title: '', emoji: '', description: '', mediaId: null, mediaType: null });
                await this.persist(); this._emit();
                return id;
            }

            async setNoteTitle(noteId, title) {
                const note = this.findNote(noteId);
                if (!note) return;
                note.title = Sanitizer.cleanText(title, 120);
                await this.persist();
            }

            async setNoteEmoji(noteId, emoji) {
                const note = this.findNote(noteId);
                if (!note) return;
                note.emoji = emoji;
                await this.persist(); this._emit();
            }

            async setNoteDescription(noteId, description) {
                const note = this.findNote(noteId);
                if (!note) return;
                note.description = Sanitizer.cleanText(description, 8000);
                await this.persist();
            }

            async setNoteMedia(noteId, file) {
                const note = this.findNote(noteId);
                if (!note) return;
                if (note.mediaId) { this.mediaUrlManager.revoke(note.mediaId); await this.db.deleteMedia(note.mediaId); }
                const mediaId = uid();
                await this.db.putMedia(mediaId, file, file.type);
                note.mediaId = mediaId;
                note.mediaType = file.type.startsWith('video') ? 'video' : 'image';
                await this.persist(); this._emit();
            }

            async removeNoteMedia(noteId) {
                const note = this.findNote(noteId);
                if (!note) return;
                if (!note.mediaId) return;
                this.mediaUrlManager.revoke(note.mediaId);
                await this.db.deleteMedia(note.mediaId);
                note.mediaId = null; note.mediaType = null;
                await this.persist(); this._emit();
            }

            async _releaseMediaForNote(note) {
                if (note.mediaId) { this.mediaUrlManager.revoke(note.mediaId); await this.db.deleteMedia(note.mediaId); }
            }

            async deleteNote(noteId) {
                const idx = this.notes.findIndex(n => n.id === noteId);
                if (idx === -1) return;
                const [removed] = this.notes.splice(idx, 1);
                await this._releaseMediaForNote(removed);
                await this.persist(); this._emit();
            }

            async reorderNote(noteId, toIndex) {
                const fromIndex = this.notes.findIndex(n => n.id === noteId);
                if (fromIndex === -1) return;
                const [item] = this.notes.splice(fromIndex, 1);
                this.notes.splice(Math.min(toIndex, this.notes.length), 0, item);
                await this.persist(); this._emit();
            }

            async exportSnapshot() {
                const blocksOut = [];
                for (const block of this.blocks) {
                    const b = { name: block.name, emoji: block.emoji || '', description: block.description || '', prompts: [] };
                    for (const prompt of block.prompts) {
                        let mediaBefore = null, mediaAfter = null, coverImage = null;
                        if (prompt.mediaBeforeId) { const rec = await this.db.getMedia(prompt.mediaBeforeId); if (rec) mediaBefore = await blobToDataURL(rec.blob); }
                        if (prompt.mediaAfterId) { const rec = await this.db.getMedia(prompt.mediaAfterId); if (rec) mediaAfter = await blobToDataURL(rec.blob); }
                        if (prompt.coverMediaId) { const rec = await this.db.getMedia(prompt.coverMediaId); if (rec) coverImage = await blobToDataURL(rec.blob); }
                        b.prompts.push({
                            title: prompt.title || '', emoji: prompt.emoji || '', text: prompt.text, description: prompt.description || '',
                            mediaBefore, mediaAfter, coverMode: prompt.coverMode || 'emoji', coverImage
                        });
                    }
                    blocksOut.push(b);
                }
                const notesOut = [];
                for (const note of this.notes) {
                    let media = null;
                    if (note.mediaId) { const rec = await this.db.getMedia(note.mediaId); if (rec) media = await blobToDataURL(rec.blob); }
                    notesOut.push({ title: note.title || '', emoji: note.emoji || '', description: note.description || '', media, mediaType: note.mediaType || null });
                }
                return { blocks: blocksOut, notes: notesOut };
            }

            async importData(json) {
                let blocksArray, notesArray;
                if (Array.isArray(json)) {
                    // Backup antiguo: un array plano de bloques, sin notas.
                    blocksArray = json;
                    notesArray = [];
                } else if (json && typeof json === 'object' && Array.isArray(json.blocks)) {
                    blocksArray = json.blocks;
                    notesArray = Array.isArray(json.notes) ? json.notes : [];
                } else {
                    throw new Error('Formato de acceso denegado.');
                }
                for (const block of this.blocks) await this._releaseMediaForBlock(block);
                for (const note of this.notes) await this._releaseMediaForNote(note);
                this.blocks = await convertLegacyBlocks(blocksArray, this.db);
                this.notes = [];
                for (const n of notesArray) {
                    const note = {
                        id: uid(),
                        title: Sanitizer.cleanText(n.title || '', 120),
                        emoji: typeof n.emoji === 'string' ? n.emoji : '',
                        description: Sanitizer.cleanText(n.description || '', 8000),
                        mediaId: null, mediaType: null
                    };
                    if (n.media) {
                        const r = await convertMediaDataUrl(n.media, this.db);
                        if (r) { note.mediaId = r.id; note.mediaType = r.type; }
                    }
                    this.notes.push(note);
                }
                await this.persist(); this._emit();
            }
        }

        /* =========================================================
         * FOCUS TRAP (accesibilidad de modales)
         * ========================================================= */
        class FocusTrap {
            constructor(container) {
                this.container = container;
                this.onEscape = null;
                this._onKeydown = this._onKeydown.bind(this);
            }
            activate() {
                this.previouslyFocused = document.activeElement;
                document.addEventListener('keydown', this._onKeydown, true);
            }
            deactivate() {
                document.removeEventListener('keydown', this._onKeydown, true);
                if (this.previouslyFocused && typeof this.previouslyFocused.focus === 'function') {
                    this.previouslyFocused.focus();
                }
            }
            _getFocusable() {
                return Array.from(this.container.querySelectorAll(
                    'a[href], button:not([disabled]), textarea, input:not([type="hidden"]), select, [tabindex]:not([tabindex="-1"])'
                )).filter(node => node.offsetParent !== null || node === document.activeElement);
            }
            _onKeydown(e) {
                if (e.key === 'Escape') { if (this.onEscape) this.onEscape(); return; }
                if (e.key !== 'Tab') return;
                const focusable = this._getFocusable();
                if (focusable.length === 0) return;
                const first = focusable[0], last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        }

        /* =========================================================
         * SELECTOR DE EMOJI (popover accesible)
         * ========================================================= */
        class EmojiPicker {
            constructor() { this.popover = null; this._onDocClick = null; this._onKey = null; }

            open(triggerEl, currentEmoji, onPick) {
                this.close();
                const pop = el('div', { class: 'emoji-popover', role: 'menu', 'aria-label': 'Selecciona un emoji' });

                const customRow = el('div', { class: 'emoji-custom-row' });
                const customInput = document.createElement('input');
                customInput.type = 'text';
                customInput.className = 'emoji-custom-input';
                customInput.placeholder = 'Pega aquí cualquier emoji…';
                customInput.maxLength = 8;
                customInput.setAttribute('aria-label', 'Pegar un emoji personalizado');
                const confirmBtn = el('button', { type: 'button', class: 'emoji-custom-confirm', text: 'Usar', 'aria-label': 'Usar este emoji' });
                const confirmCustom = () => {
                    const val = customInput.value.trim();
                    if (val) { onPick(val); this.close(); }
                };
                confirmBtn.addEventListener('click', confirmCustom);
                customInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmCustom(); } });
                customRow.append(customInput, confirmBtn);
                pop.appendChild(customRow);

                EMOJI_CHOICES.forEach(em => {
                    const btn = el('button', {
                        type: 'button', class: 'emoji-option' + (em === currentEmoji ? ' selected' : ''),
                        role: 'menuitem', 'aria-label': 'Emoji ' + em, text: em
                    });
                    btn.addEventListener('click', () => { onPick(em); this.close(); });
                    pop.appendChild(btn);
                });
                document.body.appendChild(pop);

                const r = triggerEl.getBoundingClientRect();
                const pr = pop.getBoundingClientRect();
                let top = r.bottom + 6, left = r.left;
                if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
                if (left < 8) left = 8;
                if (top + pr.height > window.innerHeight - 8) top = r.top - pr.height - 6;
                pop.style.top = top + 'px';
                pop.style.left = left + 'px';
                this.popover = pop;

                customInput.focus();

                this._onDocClick = (e) => { if (!pop.contains(e.target) && e.target !== triggerEl) this.close(); };
                this._onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); this.close(); triggerEl.focus(); } };
                setTimeout(() => {
                    document.addEventListener('click', this._onDocClick, true);
                    document.addEventListener('keydown', this._onKey, true);
                }, 0);
            }

            close() {
                if (this.popover) { this.popover.remove(); this.popover = null; }
                if (this._onDocClick) document.removeEventListener('click', this._onDocClick, true);
                if (this._onKey) document.removeEventListener('keydown', this._onKey, true);
            }
        }

        /* =========================================================
         * LIGHTBOX (visor de imagen accesible)
         * ========================================================= */
        class Lightbox {
            constructor(refs, mediaUrlManager) {
                this.overlay = refs.overlay; this.content = refs.content; this.img = refs.img; this.closeBtn = refs.closeBtn;
                this.mediaUrlManager = mediaUrlManager;
                this.focusTrap = new FocusTrap(this.content);
                this.focusTrap.onEscape = () => this.close();
                this.closeBtn.addEventListener('click', () => this.close());
                this.overlay.addEventListener('click', (e) => { if (e.target === this.overlay) this.close(); });
            }
            async open(mediaId) {
                const url = await this.mediaUrlManager.getUrl(mediaId);
                if (!url) { Toast.show('No se pudo cargar la imagen.', 'error'); return; }
                this.img.src = url;
                this.overlay.classList.remove('hidden');
                this.overlay.setAttribute('aria-hidden', 'false');
                this.closeBtn.focus();
                requestAnimationFrame(() => { this.overlay.classList.remove('opacity-0'); });
                this.focusTrap.activate();
            }
            close() {
                this.overlay.classList.add('opacity-0');
                this.focusTrap.deactivate();
                setTimeout(() => {
                    this.overlay.classList.add('hidden');
                    this.overlay.setAttribute('aria-hidden', 'true');
                }, 300);
            }
        }

        /* =========================================================
         * DIÁLOGO DE CONFIRMACIÓN (sustituye a window.confirm)
         * ========================================================= */
        class ConfirmDialog {
            constructor(refs) {
                this.overlay = refs.overlay; this.content = refs.content; this.message = refs.message;
                this.cancelBtn = refs.cancelBtn; this.okBtn = refs.okBtn;
                this.focusTrap = new FocusTrap(this.content);
                this.focusTrap.onEscape = () => this._resolve(false);
                this.cancelBtn.addEventListener('click', () => this._resolve(false));
                this.okBtn.addEventListener('click', () => this._resolve(true));
                this.overlay.addEventListener('click', (e) => { if (e.target === this.overlay) this._resolve(false); });
                this._resolveFn = null;
            }
            ask(message, okLabel) {
                this.message.textContent = message;
                this.okBtn.textContent = okLabel || 'Eliminar';
                this.overlay.classList.remove('hidden');
                this.overlay.setAttribute('aria-hidden', 'false');
                this.cancelBtn.focus();
                requestAnimationFrame(() => {
                    this.overlay.classList.remove('opacity-0');
                    this.content.classList.remove('scale-95');
                });
                this.focusTrap.activate();
                return new Promise((resolve) => { this._resolveFn = resolve; });
            }
            _resolve(value) {
                this.overlay.classList.add('opacity-0');
                this.content.classList.add('scale-95');
                this.focusTrap.deactivate();
                setTimeout(() => {
                    this.overlay.classList.add('hidden');
                    this.overlay.setAttribute('aria-hidden', 'true');
                }, 300);
                if (this._resolveFn) { const r = this._resolveFn; this._resolveFn = null; r(value); }
            }
        }

        /* =========================================================
         * MOTOR DE ARRASTRAR Y SOLTAR (Pointer Events + FLIP)
         * ========================================================= */
        class DragDropController {
            constructor(root, onDrop) {
                this.root = root;
                this.onDrop = onDrop;
                this.dragging = null;
                this._onPointerMove = this._onPointerMove.bind(this);
                this._onPointerUp = this._onPointerUp.bind(this);
                this.root.addEventListener('pointerdown', this._onPointerDown.bind(this));
            }

            _onPointerDown(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                const handle = e.target.closest('[data-drag-handle]');
                if (!handle) return;
                const item = handle.closest('[data-drag-id]');
                if (!item) return;
                e.preventDefault();

                const type = item.dataset.dragType;
                const container = item.closest('[data-drop-container="' + type + '"]');
                if (!container) return;
                const rect = item.getBoundingClientRect();

                this.dragging = {
                    type, item, pointerId: e.pointerId,
                    originContainer: container,
                    startX: e.clientX, startY: e.clientY,
                    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
                    rect, isDragging: false,
                    ghost: null, placeholder: null
                };

                item.addEventListener('pointermove', this._onPointerMove);
                item.addEventListener('pointerup', this._onPointerUp);
                item.addEventListener('pointercancel', this._onPointerUp);
            }

            _activate(d) {
                d.isDragging = true;
                try { d.item.setPointerCapture(d.pointerId); } catch (err) { /* ignora si no soportado */ }
                const rect = d.item.getBoundingClientRect();
                const ghost = d.item.cloneNode(true);
                ghost.classList.add('drag-ghost');
                ghost.style.width = rect.width + 'px';
                ghost.style.height = rect.height + 'px';
                ghost.style.transform = 'translate(' + rect.left + 'px,' + rect.top + 'px)';
                document.body.appendChild(ghost);
                d.ghost = ghost;

                const placeholder = document.createElement(d.item.tagName);
                placeholder.className = d.item.className + ' drag-placeholder';
                placeholder.style.width = rect.width + 'px';
                placeholder.style.height = rect.height + 'px';
                d.item.parentNode.insertBefore(placeholder, d.item);
                d.placeholder = placeholder;
                d.item.classList.add('drag-source-hidden');
                document.body.classList.add('is-dragging');
            }

            _onPointerMove(e) {
                const d = this.dragging;
                if (!d) return;
                if (!d.isDragging) {
                    const dx = e.clientX - d.startX, dy = e.clientY - d.startY;
                    if (Math.hypot(dx, dy) < 6) return;
                    this._activate(d);
                }
                const x = e.clientX - d.offsetX, y = e.clientY - d.offsetY;
                d.ghost.style.transform = 'translate(' + x + 'px,' + y + 'px)';
                this._updateDropTarget(d, e);
            }

            _updateDropTarget(d, e) {
                const stack = document.elementsFromPoint(e.clientX, e.clientY);
                const container = stack.map(node => node.closest && node.closest('[data-drop-container="' + d.type + '"]')).find(Boolean);
                if (!container) return;

                const selector = '[data-drag-type="' + d.type + '"]';
                const siblings = Array.from(container.querySelectorAll(':scope > ' + selector)).filter(n => n !== d.placeholder);
                const rectsBefore = new Map(siblings.map(n => [n, n.getBoundingClientRect()]));

                const hovered = stack.map(node => node.closest && node.closest(selector)).find(n => n && n !== d.placeholder && container.contains(n));

                if (hovered) {
                    const rect = hovered.getBoundingClientRect();
                    const before = e.clientX < rect.left + rect.width / 2;
                    if (before) hovered.parentNode.insertBefore(d.placeholder, hovered);
                    else hovered.parentNode.insertBefore(d.placeholder, hovered.nextSibling);
                } else if (d.placeholder.parentNode !== container) {
                    container.appendChild(d.placeholder);
                }

                requestAnimationFrame(() => {
                    siblings.forEach(node => {
                        const before = rectsBefore.get(node);
                        const after = node.getBoundingClientRect();
                        const dx = before.left - after.left, dy = before.top - after.top;
                        if (dx || dy) {
                            node.style.transition = 'none';
                            node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
                            requestAnimationFrame(() => {
                                node.style.transition = 'transform 200ms ease';
                                node.style.transform = '';
                            });
                        }
                    });
                });
            }

            _onPointerUp(e) {
                const d = this.dragging;
                if (!d) return;
                try { d.item.releasePointerCapture(d.pointerId); } catch (err) { /* no-op */ }
                d.item.removeEventListener('pointermove', this._onPointerMove);
                d.item.removeEventListener('pointerup', this._onPointerUp);
                d.item.removeEventListener('pointercancel', this._onPointerUp);

                if (d.isDragging) {
                    const finalContainer = d.placeholder.parentNode;
                    const selector = '[data-drag-type="' + d.type + '"]';
                    const typeChildren = Array.from(finalContainer.children).filter(c => c === d.placeholder || c.matches(selector));
                    const toIndex = typeChildren.indexOf(d.placeholder);

                    finalContainer.replaceChild(d.item, d.placeholder);
                    d.item.classList.remove('drag-source-hidden');
                    d.ghost.remove();
                    document.body.classList.remove('is-dragging');

                    const fromKey = d.originContainer.dataset.dropKey;
                    const toKey = finalContainer.dataset.dropKey;
                    const dragId = d.item.dataset.dragId;

                    if (this.onDrop) this.onDrop({ type: d.type, dragId, fromKey, toKey, toIndex });
                } else {
                    d.item.classList.remove('drag-source-hidden');
                }
                this.dragging = null;
            }
        }

        /* =========================================================
         * CONSTRUCTORES DE FICHAS
         * ========================================================= */
        const BLOCK_CARD_MAX_PROMPTS = 4;

        function createBlockCard(cfg) {
            const wrap = el('div', { class: 'tile-wrap', 'data-drag-type': 'block', 'data-drag-id': cfg.dragId, 'data-flip-id': cfg.flipId });

            const actions = el('div', { class: 'tile-actions' });
            const handle = el('span', { class: 'tile-action-btn drag-handle', 'data-drag-handle': '', 'aria-hidden': 'true', title: 'Arrastrar para reordenar', text: '⠿' });
            const upBtn = el('button', { type: 'button', class: 'tile-action-btn', 'aria-label': 'Mover hacia atrás', text: '‹' });
            upBtn.disabled = !!cfg.moveUpDisabled;
            upBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onMoveUp(); });
            const downBtn = el('button', { type: 'button', class: 'tile-action-btn', 'aria-label': 'Mover hacia adelante', text: '›' });
            downBtn.disabled = !!cfg.moveDownDisabled;
            downBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onMoveDown(); });
            const delBtn = el('button', { type: 'button', class: 'tile-action-btn danger', 'aria-label': cfg.deleteLabel, text: '✕' });
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onDelete(); });
            actions.append(handle, upBtn, downBtn, delBtn);

            const openBtn = el('button', { type: 'button', class: 'block-card', 'aria-label': cfg.ariaLabel });
            const header = el('div', { class: 'block-card-header' });
            header.appendChild(el('span', { class: 'block-card-emoji', 'aria-hidden': 'true', text: cfg.emoji || cfg.defaultEmoji }));
            header.appendChild(el('span', { class: 'block-card-name' + (cfg.name ? '' : ' is-placeholder'), text: cfg.name || cfg.placeholder }));
            openBtn.appendChild(header);

            const promptsWrap = el('div', { class: 'block-card-prompts' });
            if (!cfg.prompts.length) {
                promptsWrap.appendChild(el('span', { class: 'block-card-empty-prompts', text: 'Sin prompts todavía' }));
            } else {
                cfg.prompts.slice(0, BLOCK_CARD_MAX_PROMPTS).forEach(prompt => {
                    const chip = el('div', { class: 'block-prompt-chip' });
                    chip.appendChild(el('span', { 'aria-hidden': 'true', text: prompt.emoji || PROMPT_DEFAULT_EMOJI }));
                    chip.appendChild(el('span', { class: 'block-prompt-chip-name', text: prompt.title || 'Prompt sin título' }));
                    promptsWrap.appendChild(chip);
                });
                if (cfg.prompts.length > BLOCK_CARD_MAX_PROMPTS) {
                    promptsWrap.appendChild(el('span', { class: 'block-card-more', text: '+ ' + (cfg.prompts.length - BLOCK_CARD_MAX_PROMPTS) + ' más' }));
                }
            }
            openBtn.appendChild(promptsWrap);
            openBtn.addEventListener('click', cfg.onOpen);

            wrap.append(actions, openBtn);
            return wrap;
        }

        function createAddBlockCard(label, onClick) {
