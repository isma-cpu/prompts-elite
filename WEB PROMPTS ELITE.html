            const btn = el('button', { type: 'button', class: 'block-card block-card-add', 'aria-label': label });
            btn.appendChild(el('span', { class: 'block-card-emoji', 'aria-hidden': 'true', text: '✨' }));
            btn.appendChild(el('span', { class: 'block-card-name is-placeholder', text: label }));
            btn.addEventListener('click', onClick);
            wrap.appendChild(btn);
            return wrap;
        }

        function createPromptTile(cfg) {
            const wrap = el('div', { class: 'tile-wrap', 'data-drag-type': 'prompt', 'data-drag-id': cfg.dragId, 'data-flip-id': cfg.flipId });

            const actions = el('div', { class: 'tile-actions' });
            const handle = el('span', { class: 'tile-action-btn drag-handle', 'data-drag-handle': '', 'aria-hidden': 'true', title: 'Arrastrar para reordenar', text: '⠿' });
            const upBtn = el('button', { type: 'button', class: 'tile-action-btn', 'aria-label': 'Mover hacia atrás', text: '‹' });
            upBtn.disabled = !!cfg.moveUpDisabled;
            upBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onMoveUp(); });
            const downBtn = el('button', { type: 'button', class: 'tile-action-btn', 'aria-label': 'Mover hacia adelante', text: '›' });
            downBtn.disabled = !!cfg.moveDownDisabled;
            downBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onMoveDown(); });
            const delBtn = el('button', { type: 'button', class: 'tile-action-btn danger', 'aria-label': cfg.deleteLabel, text: '✕' });
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onDelete(); });
            actions.append(handle, upBtn, downBtn, delBtn);

            const hasCover = !!cfg.coverMediaId;
            const openBtn = el('button', {
                type: 'button', class: 'prompt-tile' + (cfg.dirty ? ' dirty' : '') + (hasCover ? ' has-cover' : ''),
                role: 'listitem', 'aria-label': cfg.ariaLabel
            });
            if (hasCover) {
                const img = document.createElement('img');
                img.className = 'prompt-tile-cover-img';
                img.alt = '';
                cfg.mediaUrlManager.getUrl(cfg.coverMediaId).then(url => { if (url) img.src = url; });
                const overlay = el('div', { class: 'prompt-tile-cover-overlay' });
                overlay.appendChild(el('span', { class: 'prompt-tile-title' + (cfg.title ? '' : ' is-placeholder'), text: cfg.title || 'Prompt sin título' }));
                openBtn.append(img, overlay);
            } else {
                openBtn.appendChild(el('span', { class: 'prompt-tile-emoji', 'aria-hidden': 'true', text: cfg.emoji || PROMPT_DEFAULT_EMOJI }));
                openBtn.appendChild(el('span', { class: 'prompt-tile-title' + (cfg.title ? '' : ' is-placeholder'), text: cfg.title || 'Prompt sin título' }));
                if (cfg.description) openBtn.appendChild(el('span', { class: 'prompt-tile-desc', text: cfg.description }));
            }
            openBtn.addEventListener('click', cfg.onOpen);

            const copyBtn = el('button', { type: 'button', class: 'prompt-tile-copy', 'aria-label': cfg.copyLabel, title: 'Copiar prompt', text: 'Copiar' });
            copyBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onCopy(copyBtn); });

            wrap.append(actions, openBtn, copyBtn);
            return wrap;
        }

        function createAddPromptTile(label, onClick) {
            const wrap = el('div', { class: 'tile-wrap' });
            const btn = el('button', { type: 'button', class: 'prompt-tile prompt-tile-add', 'aria-label': label });
            btn.appendChild(el('span', { class: 'prompt-tile-emoji', 'aria-hidden': 'true', text: '+' }));
            btn.appendChild(el('span', { class: 'prompt-tile-title is-placeholder', text: label }));
            btn.addEventListener('click', onClick);
            wrap.appendChild(btn);
            return wrap;
        }

        function createNoteTile(cfg) {
            const wrap = el('div', { class: 'tile-wrap', 'data-drag-type': 'note', 'data-drag-id': cfg.dragId, 'data-flip-id': cfg.flipId });

            const actions = el('div', { class: 'tile-actions' });
            const handle = el('span', { class: 'tile-action-btn drag-handle', 'data-drag-handle': '', 'aria-hidden': 'true', title: 'Arrastrar para reordenar', text: '⠿' });
            const delBtn = el('button', { type: 'button', class: 'tile-action-btn danger', 'aria-label': cfg.deleteLabel, text: '✕' });
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); cfg.onDelete(); });
            actions.append(handle, delBtn);

            const openBtn = el('button', { type: 'button', class: 'note-tile', 'aria-label': cfg.ariaLabel });
            openBtn.appendChild(el('span', { class: 'note-tile-emoji', 'aria-hidden': 'true', text: cfg.emoji || NOTE_DEFAULT_EMOJI }));
            openBtn.appendChild(el('span', { class: 'note-tile-title' + (cfg.title ? '' : ' is-placeholder'), text: cfg.title || 'Nota' }));
            openBtn.addEventListener('click', cfg.onOpen);

            wrap.append(actions, openBtn);
            return wrap;
        }

        function createAddNoteTile(onClick) {
            const wrap = el('div', { class: 'tile-wrap' });
            const btn = el('button', { type: 'button', class: 'note-tile note-tile-add', 'aria-label': 'Nueva nota' });
            btn.appendChild(el('span', { class: 'note-tile-emoji', 'aria-hidden': 'true', text: '+' }));
            btn.appendChild(el('span', { class: 'note-tile-title is-placeholder', text: 'Nota' }));
            btn.addEventListener('click', onClick);
            wrap.appendChild(btn);
            return wrap;
        }

        function wireFileDropzone(zoneEl, onFile) {
            ['dragenter', 'dragover'].forEach(evt => zoneEl.addEventListener(evt, (e) => {
                e.preventDefault(); e.stopPropagation();
                zoneEl.classList.add('dropzone-active');
            }));
            ['dragleave', 'dragend'].forEach(evt => zoneEl.addEventListener(evt, (e) => {
                e.preventDefault(); e.stopPropagation();
                zoneEl.classList.remove('dropzone-active');
            }));
            zoneEl.addEventListener('drop', (e) => {
                e.preventDefault(); e.stopPropagation();
                zoneEl.classList.remove('dropzone-active');
                const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                if (file) onFile(file);
            });
        }

        /* =========================================================
         * VISTA / RENDERIZADOR DEL ESPACIO DE TRABAJO (bloques)
         * ========================================================= */
        class Renderer {
            constructor(root) { this.root = root; }

            render(blocks, handlers) {
                const flippable = new Map();
                this.root.querySelectorAll('[data-flip-id]').forEach(node => {
                    flippable.set(node.dataset.flipId, node.getBoundingClientRect());
                });

                this.root.innerHTML = '';

                blocks.forEach((block, idx) => {
                    this.root.appendChild(createBlockCard({
                        emoji: block.emoji, defaultEmoji: BLOCK_DEFAULT_EMOJI, name: block.name, placeholder: 'Bloque sin nombre',
                        dragId: block.id, flipId: 'block-' + block.id,
                        ariaLabel: 'Abrir bloque ' + (block.name || 'sin nombre'),
                        prompts: block.prompts.map(p => ({ emoji: p.emoji, title: p.title })),
                        onOpen: () => handlers.onOpenBlock(block.id),
                        onDelete: () => handlers.onDeleteBlock(block.id),
                        onMoveUp: () => handlers.onMoveBlock(block.id, -1),
                        onMoveDown: () => handlers.onMoveBlock(block.id, 1),
                        moveUpDisabled: idx === 0, moveDownDisabled: idx === blocks.length - 1,
                        deleteLabel: 'Eliminar bloque ' + (block.name || '')
                    }));
                });
                this.root.appendChild(createAddBlockCard('Nuevo bloque', handlers.onAddBlock));

                this.root.querySelectorAll('[data-flip-id]').forEach(node => {
                    const before = flippable.get(node.dataset.flipId);
                    if (!before) return;
                    const after = node.getBoundingClientRect();
                    const dx = before.left - after.left, dy = before.top - after.top;
                    if (dx || dy) {
                        node.style.transition = 'none';
                        node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
                        requestAnimationFrame(() => {
                            node.style.transition = 'transform 220ms cubic-bezier(0.22,1,0.36,1)';
                            node.style.transform = '';
                        });
                    }
                });
            }
        }

        /* =========================================================
         * APLICACIÓN (orquestación, navegación, delegación de eventos)
         * ========================================================= */
        class App {
            constructor() {
                this.db = new Database();
                this.mediaUrlManager = new MediaUrlManager(this.db);
                this.store = new PromptStore(this.db, this.mediaUrlManager);
                this.workspace = document.getElementById('workspace');
                this.renderer = new Renderer(this.workspace);
                this.notesGrid = document.getElementById('notesGrid');
                this.emojiPicker = new EmojiPicker();

                this.detailOverlay = document.getElementById('detailModal');
                this.detailContent = document.getElementById('detailModalContent');
                this.detailBreadcrumb = document.getElementById('detailBreadcrumb');
                this.detailBody = document.getElementById('detailBody');
                this.detailCloseBtn = document.getElementById('detailCloseBtn');
                this.detailFocusTrap = new FocusTrap(this.detailContent);
                this.detailFocusTrap.onEscape = () => this._confirmDiscardDirtyIfNeeded(() => this.closeDetail());
                this.detailCloseBtn.addEventListener('click', () => this._confirmDiscardDirtyIfNeeded(() => this.closeDetail()));
                this.detailOverlay.addEventListener('click', (e) => { if (e.target === this.detailOverlay) this._confirmDiscardDirtyIfNeeded(() => this.closeDetail()); });
                this.detailBody.addEventListener('change', (e) => this._onDetailChange(e));

                this.lightbox = new Lightbox({
                    overlay: document.getElementById('lightbox'),
                    content: document.getElementById('lightboxContent'),
                    img: document.getElementById('lightboxImg'),
                    closeBtn: document.getElementById('lightboxCloseBtn')
                }, this.mediaUrlManager);

                this.confirmDialog = new ConfirmDialog({
                    overlay: document.getElementById('confirmModal'),
                    content: document.getElementById('confirmModalContent'),
                    message: document.getElementById('confirmModalMessage'),
                    cancelBtn: document.getElementById('confirmCancelBtn'),
                    okBtn: document.getElementById('confirmOkBtn')
                });

                this.dragDrop = new DragDropController(document.body, (info) => this._handleDrop(info));

                // Evita que soltar un archivo fuera de una zona de arrastre navegue a él en el navegador.
                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => e.preventDefault());

                this.detail = { level: 'closed', blockId: null, promptId: null, noteId: null };
                this.dirtyPrompts = new Map(); // promptId -> { title, text } (borrador sin guardar)
                this._saveFlashTimer = null;
                this.saveIndicator = document.getElementById('saveIndicator');
                this.saveLabel = document.getElementById('saveLabel');

                this.store.addEventListener('change', () => {
                    this.renderer.render(this.store.blocks, this._workspaceHandlers());
                    this._renderNotes();
                    if (this.detail.level !== 'closed') this.renderDetail(false);
                });
                this.store.addEventListener('saved', () => this._flashSaveIndicator());
            }

            async init() {
                try {
                    await this.store.load();
                } catch (err) {
                    console.error(err);
                    Toast.show('No se pudo abrir la base de datos local.', 'error');
                }
                this.renderer.render(this.store.blocks, this._workspaceHandlers());
                this._renderNotes();
                document.getElementById('loadingOverlay').remove();
                this._wireHeader();
            }

            _renderNotes() {
                this.notesGrid.innerHTML = '';
                this.store.notes.forEach(note => {
                    this.notesGrid.appendChild(createNoteTile({
                        emoji: note.emoji, title: note.title,
                        dragId: note.id, flipId: 'note-' + note.id,
                        ariaLabel: 'Abrir nota ' + (note.title || 'sin título'),
                        deleteLabel: 'Eliminar nota ' + (note.title || ''),
                        onOpen: () => this.openNote(note.id),
                        onDelete: () => this._confirmAndRun('⚠️ ¿Eliminar esta nota?', () => this.store.deleteNote(note.id))
                    }));
                });
                this.notesGrid.appendChild(createAddNoteTile(() => this._addNote()));
            }

            _workspaceHandlers() {
                return {
                    onOpenBlock: (id) => this.openBlock(id),
                    onDeleteBlock: (id) => this._confirmAndRun('⚠️ ¿Eliminar este bloque y todo su contenido?', () => this.store.deleteBlock(id)),
                    onMoveBlock: (id, delta) => this.store.moveBlockBy(id, delta),
                    onAddBlock: () => this._addBlock()
                };
            }

            _wireHeader() {
                document.getElementById('headerActions').addEventListener('click', (e) => {
                    const actionEl = e.target.closest('[data-action]');
                    if (!actionEl) return;
                    if (actionEl.dataset.action === 'add-block') this._addBlock();
                    else if (actionEl.dataset.action === 'add-note') this._addNote();
                    else if (actionEl.dataset.action === 'export-data') this._exportData();
                });
                document.getElementById('importFile').addEventListener('change', (e) => this._importData(e));
            }

            async _confirmAndRun(message, fn, okLabel) {
                const ok = await this.confirmDialog.ask(message, okLabel);
                if (ok) fn();
            }

            async _confirmDiscardDirtyIfNeeded(proceedFn) {
                if (this.dirtyPrompts.size === 0) { proceedFn(); return; }
                const ok = await this.confirmDialog.ask('Tienes cambios sin guardar en el prompt. ¿Quieres descartarlos?', 'Descartar');
                if (ok) {
                    this.dirtyPrompts.clear();
                    proceedFn();
                }
            }

            _flashSaveIndicator() {
                clearTimeout(this._saveFlashTimer);
                this.saveIndicator.classList.add('is-saved');
                this.saveLabel.textContent = 'Guardado';
                this._saveFlashTimer = setTimeout(() => {
                    this.saveIndicator.classList.remove('is-saved');
                    this.saveLabel.textContent = 'Autoguardado';
                }, 1600);
            }

            async _handleDrop(info) {
                if (info.type === 'block') {
                    await this.store.reorderBlock(info.dragId, info.toIndex);
                } else if (info.type === 'prompt') {
                    await this.store.reorderPrompt(info.toKey, info.dragId, info.toIndex);
                } else if (info.type === 'note') {
                    await this.store.reorderNote(info.dragId, info.toIndex);
                }
            }

            /* ---------- Navegación del modal de detalle ---------- */

            openBlock(blockId) {
                this.detail = { level: 'block', blockId, promptId: null, noteId: null };
                this.dirtyPrompts.clear();
                this._showDetailOverlay();
                this.renderDetail(true);
            }

            openPrompt(blockId, promptId) {
                this.detail = { level: 'prompt', blockId, promptId, noteId: null };
                this.dirtyPrompts.clear();
                this.renderDetail(true);
            }

            openNote(noteId) {
                this.detail = { level: 'note', blockId: null, promptId: null, noteId };
                this._showDetailOverlay();
                this.renderDetail(true);
            }

            backToBlock() {
                this.detail.level = 'block';
                this.detail.promptId = null;
                this.renderDetail(true);
            }

            closeDetail() {
                this.detailOverlay.classList.add('opacity-0');
                this.detailContent.classList.add('scale-95');
                this.detailFocusTrap.deactivate();
                setTimeout(() => {
                    this.detailOverlay.classList.add('hidden');
                    this.detailOverlay.setAttribute('aria-hidden', 'true');
                }, 300);
                this.detail = { level: 'closed', blockId: null, promptId: null, noteId: null };
                this.dirtyPrompts.clear();
                this.renderer.render(this.store.blocks, this._workspaceHandlers());
                this._renderNotes();
            }

            _showDetailOverlay() {
                this.detailOverlay.classList.remove('hidden');
                this.detailOverlay.setAttribute('aria-hidden', 'false');
                requestAnimationFrame(() => {
                    this.detailOverlay.classList.remove('opacity-0');
                    this.detailContent.classList.remove('scale-95');
                });
                this.detailFocusTrap.activate();
            }

            _captureFocusKey() {
                const a = document.activeElement;
                if (!a || !this.detailBody.contains(a)) return null;
                return [a.tagName, a.dataset.action || '', a.dataset.field || '', a.dataset.blockId || '', a.dataset.promptId || '', a.dataset.noteId || ''].join('|');
            }

            _restoreFocus(key) {
                if (key) {
                    const candidates = this.detailBody.querySelectorAll('[data-action],[data-field]');
                    for (const c of candidates) {
                        const k = [c.tagName, c.dataset.action || '', c.dataset.field || '', c.dataset.blockId || '', c.dataset.promptId || '', c.dataset.noteId || ''].join('|');
                        if (k === key) { c.focus(); return; }
                    }
                }
                this.detailBody.focus();
            }

            renderDetail(focusFirst) {
                const key = focusFirst ? null : this._captureFocusKey();
                const scrollTop = this.detailBody.scrollTop;
                this.detailBody.innerHTML = '';
                this.detailBreadcrumb.innerHTML = '';

                if (this.detail.level === 'block') {
                    const block = this.store.findBlock(this.detail.blockId);
                    if (!block) { this.closeDetail(); return; }
                    this.detailBreadcrumb.appendChild(el('span', { class: 'flex items-center gap-1.5 font-bold text-white', text: (block.emoji || BLOCK_DEFAULT_EMOJI) + ' ' + (block.name || 'Bloque sin nombre') }));
                    this.detailBody.appendChild(this._buildBlockDetail(block));
                } else if (this.detail.level === 'prompt') {
                    const block = this.store.findBlock(this.detail.blockId);
                    const prompt = block && this.store.findPrompt(this.detail.blockId, this.detail.promptId);
                    if (!block || !prompt) { this.backToBlock(); return; }
                    const backBtn = el('button', { type: 'button', class: 'text-yellow-500 hover:underline font-bold', text: (block.emoji || BLOCK_DEFAULT_EMOJI) + ' ' + (block.name || 'Bloque sin nombre') });
                    backBtn.addEventListener('click', () => this._confirmDiscardDirtyIfNeeded(() => this.backToBlock()));
                    this.detailBreadcrumb.append(
                        backBtn,
                        el('span', { class: 'text-gray-600', 'aria-hidden': 'true', text: '›' }),
                        el('span', { class: 'text-white font-bold truncate', text: (prompt.emoji || PROMPT_DEFAULT_EMOJI) + ' ' + (prompt.title || 'Prompt sin título') })
                    );
                    this.detailBody.appendChild(this._buildPromptDetail(block, prompt));
                } else if (this.detail.level === 'note') {
                    const note = this.store.findNote(this.detail.noteId);
                    if (!note) { this.closeDetail(); return; }
                    this.detailBreadcrumb.appendChild(el('span', { class: 'flex items-center gap-1.5 font-bold text-white', text: (note.emoji || NOTE_DEFAULT_EMOJI) + ' ' + (note.title || 'Nota sin título') }));
                    this.detailBody.appendChild(this._buildNoteDetail(note));
                }

                this.detailBody.scrollTop = scrollTop;
                if (focusFirst) {
                    const firstFocusable = this.detailBody.querySelector('input, button, textarea');
                    (firstFocusable || this.detailBody).focus();
                } else {
                    this._restoreFocus(key);
                }
            }

            /* ---------- Constructores de contenido del detalle ---------- */

            _buildBlockDescriptionArea(block) {
                const container = el('div', { class: 'mt-1' });
                const showTextarea = (autofocus) => {
                    container.innerHTML = '';
                    const descInput = document.createElement('textarea');
                    descInput.className = 'detail-desc-input';
                    descInput.value = block.description || '';
                    descInput.placeholder = 'Añade una descripción...';
                    descInput.rows = 2;
                    descInput.setAttribute('aria-label', 'Descripción del bloque');
                    descInput.dataset.field = 'description';
                    descInput.dataset.blockId = block.id;
                    descInput.addEventListener('blur', async () => {
                        const val = descInput.value;
                        await this.store.setBlockDescription(block.id, val);
                        if (!val.trim()) showLink();
                    });
                    container.appendChild(descInput);
                    if (autofocus) descInput.focus();
                };
                const showLink = () => {
                    container.innerHTML = '';
                    const btn = el('button', { type: 'button', class: 'add-description-btn', text: '✚ Añadir descripción' });
                    btn.addEventListener('click', () => showTextarea(true));
                    container.appendChild(btn);
                };
                if (block.description && block.description.trim()) showTextarea(false); else showLink();
                return container;
            }

            _buildBlockDetail(block) {
                const container = el('div', { class: 'flex flex-col gap-6' });

                const headRow = el('div', { class: 'flex items-start gap-4' });
                const emojiBtn = el('button', {
                    type: 'button', class: 'emoji-trigger', 'aria-label': 'Cambiar emoji', text: block.emoji || BLOCK_DEFAULT_EMOJI,
                    'data-field': 'emoji-trigger', 'data-block-id': block.id
                });
                emojiBtn.addEventListener('click', () => this.emojiPicker.open(emojiBtn, block.emoji || BLOCK_DEFAULT_EMOJI, (em) => this.store.setBlockEmoji(block.id, em)));

                const nameWrap = el('div', { class: 'flex-1 min-w-0' });
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'detail-name-input';
                nameInput.value = block.name || '';
                nameInput.placeholder = 'Nombre del bloque';
                nameInput.maxLength = 120;
                nameInput.setAttribute('aria-label', 'Nombre del bloque');
                nameInput.dataset.field = 'name';
                nameInput.dataset.blockId = block.id;
                nameInput.addEventListener('blur', () => this.store.setBlockName(block.id, nameInput.value));
                nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); } });
                nameWrap.appendChild(nameInput);
                nameWrap.appendChild(this._buildBlockDescriptionArea(block));

                headRow.append(emojiBtn, nameWrap);
                container.appendChild(headRow);

                const grid = el('div', {
                    class: 'prompt-grid', role: 'list', 'aria-label': 'Prompts del bloque',
                    'data-drop-container': 'prompt', 'data-drop-key': block.id
                });
                block.prompts.forEach((prompt, idx) => {
                    grid.appendChild(createPromptTile({
                        emoji: prompt.emoji, title: prompt.title, description: prompt.description,
                        coverMediaId: this._resolvePromptCoverMediaId(prompt), mediaUrlManager: this.mediaUrlManager,
                        dragId: prompt.id, flipId: 'prompt-' + prompt.id,
                        dirty: this.dirtyPrompts.has(prompt.id),
                        ariaLabel: 'Abrir prompt ' + (prompt.title || (idx + 1)),
                        deleteLabel: 'Eliminar prompt ' + (prompt.title || ''),
                        copyLabel: 'Copiar prompt ' + (prompt.title || ''),
                        moveUpDisabled: idx === 0, moveDownDisabled: idx === block.prompts.length - 1,
                        onOpen: () => this.openPrompt(block.id, prompt.id),
                        onDelete: () => this._confirmAndRun('⚠️ ¿Eliminar este prompt?', () => this.store.deletePrompt(block.id, prompt.id)),
                        onCopy: (btnEl) => this._copyPromptText(block.id, prompt.id, btnEl),
                        onMoveUp: () => this.store.movePromptBy(block.id, prompt.id, -1),
                        onMoveDown: () => this.store.movePromptBy(block.id, prompt.id, 1)
                    }));
                });
                grid.appendChild(createAddPromptTile('Nuevo prompt', () => this._addPrompt(block.id)));
                container.appendChild(grid);

                const dangerRow = el('div', { class: 'pt-4 mt-2 border-t border-[#1c1c1c] flex justify-start' });
                const deleteBtn = el('button', { type: 'button', class: 'btn-danger px-6 py-2.5 rounded-lg text-sm font-bold uppercase tracking-wide', text: 'Eliminar bloque' });
                deleteBtn.addEventListener('click', () => this._confirmAndRun('⚠️ ¿Eliminar este bloque y todo su contenido?', () => { this.closeDetail(); this.store.deleteBlock(block.id); }));
                dangerRow.appendChild(deleteBtn);
                container.appendChild(dangerRow);

                return container;
            }

            _buildNoteDescriptionArea(note) {
                const container = el('div', { class: 'mt-3' });
                const descInput = document.createElement('textarea');
                descInput.className = 'detail-desc-input note-detail-textarea';
                descInput.value = note.description || '';
                descInput.placeholder = 'Escribe aquí el contenido de la nota...';
                descInput.rows = 6;
                descInput.setAttribute('aria-label', 'Contenido de la nota');
                descInput.dataset.field = 'description';
                descInput.dataset.noteId = note.id;
                const autoResize = () => {
                    descInput.style.height = 'auto';
                    descInput.style.height = Math.max(descInput.scrollHeight + 2, 220) + 'px';
                };
                descInput.addEventListener('input', autoResize);
                descInput.addEventListener('blur', () => this.store.setNoteDescription(note.id, descInput.value));
                container.appendChild(descInput);
                requestAnimationFrame(autoResize);
                return container;
            }

            _buildNoteDetail(note) {
                const container = el('div', { class: 'flex flex-col gap-6' });

                const headRow = el('div', { class: 'flex items-start gap-4' });
                const emojiBtn = el('button', {
                    type: 'button', class: 'emoji-trigger', 'aria-label': 'Cambiar emoji', text: note.emoji || NOTE_DEFAULT_EMOJI,
                    'data-field': 'emoji-trigger', 'data-note-id': note.id
                });
                emojiBtn.addEventListener('click', () => this.emojiPicker.open(emojiBtn, note.emoji || NOTE_DEFAULT_EMOJI, (em) => this.store.setNoteEmoji(note.id, em)));

                const nameWrap = el('div', { class: 'flex-1 min-w-0' });
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'detail-name-input';
                nameInput.value = note.title || '';
                nameInput.placeholder = 'Título de la nota';
                nameInput.maxLength = 120;
                nameInput.setAttribute('aria-label', 'Título de la nota');
                nameInput.dataset.field = 'name';
                nameInput.dataset.noteId = note.id;
                nameInput.addEventListener('blur', () => this.store.setNoteTitle(note.id, nameInput.value));
                nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); } });
                nameWrap.appendChild(nameInput);
                nameWrap.appendChild(this._buildNoteDescriptionArea(note));

                headRow.append(emojiBtn, nameWrap);
                container.appendChild(headRow);

                container.appendChild(this._buildNoteMediaSlot(note));

                const dangerRow = el('div', { class: 'pt-4 mt-2 border-t border-[#1c1c1c] flex justify-start' });
                const deleteBtn = el('button', { type: 'button', class: 'btn-danger px-6 py-2.5 rounded-lg text-sm font-bold uppercase tracking-wide', text: 'Eliminar nota' });
                deleteBtn.addEventListener('click', () => this._confirmAndRun('⚠️ ¿Eliminar esta nota?', () => { this.closeDetail(); this.store.deleteNote(note.id); }));
                dangerRow.appendChild(deleteBtn);
                container.appendChild(dangerRow);

                return container;
            }

            _buildNoteMediaSlot(note) {
                const wrap = el('div', { class: 'note-media-attach' });
                wrap.appendChild(el('span', { class: 'note-media-attach-label', text: 'Adjunto (opcional)' }));
                if (note.mediaId) {
                    const preview = el('div', { class: 'note-media-preview' });
                    let mediaEl;
                    if (note.mediaType === 'video') {
                        mediaEl = document.createElement('video');
                        mediaEl.controls = true;
                        mediaEl.setAttribute('aria-label', 'Vídeo adjunto de la nota');
                    } else {
                        mediaEl = document.createElement('img');
                        mediaEl.alt = 'Imagen adjunta de la nota';
                        mediaEl.tabIndex = 0;
                        mediaEl.style.cursor = 'pointer';
                        mediaEl.setAttribute('role', 'button');
                        mediaEl.setAttribute('aria-label', 'Ver imagen a tamaño completo');
                        mediaEl.addEventListener('click', () => this.lightbox.open(note.mediaId));
                        mediaEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.lightbox.open(note.mediaId); } });
                    }
                    this.mediaUrlManager.getUrl(note.mediaId).then(url => { if (url) mediaEl.src = url; });
                    const removeBtn = el('button', { type: 'button', class: 'note-media-preview-remove', 'aria-label': 'Eliminar adjunto', text: '✕' });
                    removeBtn.addEventListener('click', () => this.store.removeNoteMedia(note.id));
                    preview.append(mediaEl, removeBtn);
                    wrap.appendChild(preview);
                } else {
                    const zone = el('label', { class: 'note-media-dropzone' });
                    zone.appendChild(el('span', { 'aria-hidden': 'true', text: '+' }));
                    zone.appendChild(document.createTextNode(' Añade una imagen o vídeo'));
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*,video/*';
                    input.className = 'hidden';
                    input.setAttribute('aria-label', 'Añadir imagen o vídeo a la nota');
                    input.dataset.action = 'add-note-media';
                    input.dataset.noteId = note.id;
                    zone.appendChild(input);
                    wireFileDropzone(zone, (file) => this._handleNoteMediaFile(note.id, file));
                    wrap.appendChild(zone);
                }
                return wrap;
            }

            // Devuelve el id de media a usar como portada de la ficha (solo si es una imagen), o null
            // si debe mostrarse el emoji. Los vídeos nunca se usan como portada de la ficha cuadrada.
            _resolvePromptCoverMediaId(prompt) {
                const mode = prompt.coverMode || 'emoji';
                if (mode === 'after' && prompt.mediaAfterId && prompt.mediaAfterType === 'image') return prompt.mediaAfterId;
                if (mode === 'custom' && prompt.coverMediaId && prompt.coverMediaType === 'image') return prompt.coverMediaId;
                return null;
            }

            _buildCoverPicker(block, prompt, onAction) {
                const wrap = el('div', { class: 'cover-picker' });
                wrap.appendChild(el('span', { class: 'cover-picker-label', text: 'Portada de la ficha' }));
                const options = el('div', { class: 'cover-options' });
                const mode = prompt.coverMode || 'emoji';
                const run = (fn) => { fn(); if (onAction) onAction(); };

                const emojiOpt = el('button', {
                    type: 'button', class: 'cover-option' + (mode === 'emoji' ? ' selected' : ''),
                    'aria-label': 'Usar el emoji como portada', title: 'Emoji'
                });
                emojiOpt.appendChild(el('span', { class: 'cover-option-emoji', 'aria-hidden': 'true', text: prompt.emoji || PROMPT_DEFAULT_EMOJI }));
                emojiOpt.appendChild(el('span', { class: 'cover-option-label', text: 'Emoji' }));
                emojiOpt.addEventListener('click', () => run(() => this.store.setPromptCoverMode(block.id, prompt.id, 'emoji')));
                options.appendChild(emojiOpt);

                const hasAfterImage = !!(prompt.mediaAfterId && prompt.mediaAfterType === 'image');
                const afterOpt = el('button', {
                    type: 'button', class: 'cover-option' + (mode === 'after' ? ' selected' : '') + (hasAfterImage ? '' : ' disabled'),
                    'aria-label': 'Usar la imagen "Después" como portada',
                    title: hasAfterImage ? 'Imagen "Después"' : 'Añade primero una imagen en "Después"'
                });
                if (hasAfterImage) {
                    const img = document.createElement('img');
                    img.alt = '';
                    this.mediaUrlManager.getUrl(prompt.mediaAfterId).then(url => { if (url) img.src = url; });
                    afterOpt.appendChild(img);
                    afterOpt.addEventListener('click', () => run(() => this.store.setPromptCoverMode(block.id, prompt.id, 'after')));
                } else {
                    afterOpt.appendChild(el('span', { class: 'cover-option-emoji', 'aria-hidden': 'true', text: '🖼️' }));
                }
                afterOpt.appendChild(el('span', { class: 'cover-option-label', text: 'Después' }));
                options.appendChild(afterOpt);

                const hasCustom = !!prompt.coverMediaId;
                const customOpt = el('button', {
                    type: 'button', class: 'cover-option' + (mode === 'custom' ? ' selected' : ''),
                    'aria-label': hasCustom ? 'Usar la portada personalizada' : 'Subir o arrastrar una portada personalizada',
                    title: 'Personalizada'
                });
                if (hasCustom) {
                    const img = document.createElement('img');
                    img.alt = '';
                    this.mediaUrlManager.getUrl(prompt.coverMediaId).then(url => { if (url) img.src = url; });
                    customOpt.appendChild(img);
                    const removeBtn = el('button', { type: 'button', class: 'cover-option-remove', 'aria-label': 'Eliminar portada personalizada', text: '✕' });
                    removeBtn.addEventListener('click', (e) => { e.stopPropagation(); run(() => this.store.removePromptCoverMedia(block.id, prompt.id)); });
                    customOpt.appendChild(removeBtn);
                    customOpt.addEventListener('click', () => run(() => this.store.setPromptCoverMode(block.id, prompt.id, 'custom')));
                } else {
                    customOpt.appendChild(el('span', { class: 'cover-option-emoji', 'aria-hidden': 'true', text: '+' }));
                }
                customOpt.appendChild(el('span', { class: 'cover-option-label', text: hasCustom ? 'Personal' : 'Subir' }));
                const coverInput = document.createElement('input');
                coverInput.type = 'file';
                coverInput.accept = 'image/*';
                coverInput.className = 'hidden';
                coverInput.setAttribute('aria-label', 'Subir portada personalizada');
                coverInput.addEventListener('click', (e) => e.stopPropagation());
                coverInput.addEventListener('change', () => {
                    const file = coverInput.files[0];
                    coverInput.value = '';
                    if (file) run(() => this._handleCoverFile(block.id, prompt.id, file));
                });
                customOpt.appendChild(coverInput);
                if (!hasCustom) customOpt.addEventListener('click', () => coverInput.click());
                wireFileDropzone(customOpt, (file) => run(() => this._handleCoverFile(block.id, prompt.id, file)));
                options.appendChild(customOpt);

                wrap.appendChild(options);
                return wrap;
            }

            _toggleCoverPopover(triggerEl, block, prompt) {
                const existing = document.querySelector('.cover-popover');
                if (existing) { existing.remove(); return; }

                const pop = el('div', { class: 'cover-popover', role: 'dialog', 'aria-label': 'Elegir portada de la ficha' });
                const close = () => {
                    pop.remove();
                    document.removeEventListener('click', onDocClick, true);
                    document.removeEventListener('keydown', onKey, true);
                };
                pop.appendChild(this._buildCoverPicker(block, prompt, close));
                document.body.appendChild(pop);

                const r = triggerEl.getBoundingClientRect();
                const pr = pop.getBoundingClientRect();
                let top = r.bottom + 6, left = r.right - pr.width;
                if (left < 8) left = 8;
                if (top + pr.height > window.innerHeight - 8) top = r.top - pr.height - 6;
                pop.style.top = top + 'px';
                pop.style.left = left + 'px';

                const onDocClick = (e) => { if (!pop.contains(e.target) && e.target !== triggerEl) close(); };
                const onKey = (e) => { if (e.key === 'Escape') { close(); triggerEl.focus(); } };
                setTimeout(() => {
                    document.addEventListener('click', onDocClick, true);
                    document.addEventListener('keydown', onKey, true);
                }, 0);
            }

            _toggleMoveBlockPopover(triggerEl, block, prompt) {
                const existing = document.querySelector('.move-block-popover');
                if (existing) { existing.remove(); return; }

                const pop = el('div', { class: 'move-block-popover', role: 'dialog', 'aria-label': 'Mover prompt a otro bloque' });
                const close = () => {
                    pop.remove();
                    document.removeEventListener('click', onDocClick, true);
                    document.removeEventListener('keydown', onKey, true);
                };
                pop.appendChild(el('span', { class: 'move-block-label', text: 'Mover a...' }));
                const others = this.store.blocks.filter(b => b.id !== block.id);
                if (others.length === 0) {
                    pop.appendChild(el('span', { class: 'move-block-empty', text: 'No hay otros bloques.' }));
                } else {
                    others.forEach(b => {
                        const opt = el('button', { type: 'button', class: 'move-block-option' });
                        opt.appendChild(el('span', { class: 'move-block-emoji', 'aria-hidden': 'true', text: b.emoji || BLOCK_DEFAULT_EMOJI }));
                        opt.appendChild(el('span', { text: b.name || 'Sin nombre' }));
                        opt.addEventListener('click', async () => {
                            close();
                            await this.store.movePromptToBlock(block.id, prompt.id, b.id);
                            this.openPrompt(b.id, prompt.id);
                        });
                        pop.appendChild(opt);
                    });
                }
                document.body.appendChild(pop);

                const r = triggerEl.getBoundingClientRect();
                const pr = pop.getBoundingClientRect();
                let top = r.bottom + 6, left = r.left;
                if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
                if (top + pr.height > window.innerHeight - 8) top = r.top - pr.height - 6;
                pop.style.top = top + 'px';
                pop.style.left = left + 'px';

                const onDocClick = (e) => { if (!pop.contains(e.target) && e.target !== triggerEl) close(); };
                const onKey = (e) => { if (e.key === 'Escape') { close(); triggerEl.focus(); } };
                setTimeout(() => {
                    document.addEventListener('click', onDocClick, true);
                    document.addEventListener('keydown', onKey, true);
                }, 0);
            }

            _buildPromptDetail(block, prompt) {
                const draft = this.dirtyPrompts.get(prompt.id);
                const isDirty = !!draft;
                const container = el('div', { class: 'flex flex-col gap-6' });

                const topRow = el('div', { class: 'flex items-center gap-2 flex-wrap' });
                const backBtn = el('button', {
                    type: 'button', class: 'btn-dark px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wide flex items-center gap-1.5'
                }, [el('span', { 'aria-hidden': 'true', text: '‹' }), 'Volver al bloque']);
                backBtn.addEventListener('click', () => this._confirmDiscardDirtyIfNeeded(() => this.backToBlock()));
                topRow.appendChild(backBtn);

                const moveBtn = el('button', {
                    type: 'button', class: 'btn-dark px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wide flex items-center gap-1.5'
                }, [el('span', { 'aria-hidden': 'true', text: '⇄' }), 'Mover a otro bloque']);
                moveBtn.addEventListener('click', () => this._toggleMoveBlockPopover(moveBtn, block, prompt));
                topRow.appendChild(moveBtn);

                container.appendChild(topRow);

                const headRow = el('div', { class: 'flex items-start gap-4' });
                const emojiBtn = el('button', {
                    type: 'button', class: 'emoji-trigger', 'aria-label': 'Cambiar emoji del prompt', text: prompt.emoji || PROMPT_DEFAULT_EMOJI,
                    'data-field': 'emoji-trigger', 'data-prompt-id': prompt.id
                });
                emojiBtn.addEventListener('click', () => this.emojiPicker.open(emojiBtn, prompt.emoji || PROMPT_DEFAULT_EMOJI, (em) => this.store.setPromptEmoji(block.id, prompt.id, em)));

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'detail-name-input';
                titleInput.value = draft ? draft.title : (prompt.title || '');
                titleInput.placeholder = 'Título del prompt (opcional)';
                titleInput.maxLength = 150;
                titleInput.setAttribute('aria-label', 'Título del prompt');
                titleInput.dataset.field = 'prompt-title';
                titleInput.dataset.promptId = prompt.id;

                const titleWrap = el('div', { class: 'flex-1 min-w-0' });
                titleWrap.appendChild(titleInput);

                const coverBtn = el('button', {
                    type: 'button', class: 'emoji-trigger', style: 'width:2.9rem;height:2.9rem;font-size:1.3rem;',
                    'aria-label': 'Elegir portada de la ficha', title: 'Portada', text: '🖼️'
                });
                coverBtn.addEventListener('click', () => this._toggleCoverPopover(coverBtn, block, prompt));

                headRow.append(emojiBtn, titleWrap, coverBtn);
                container.appendChild(headRow);

                const textarea = document.createElement('textarea');
                textarea.className = 'w-full bg-transparent text-gray-200 text-sm outline-none resize-none border border-[#222] focus:border-yellow-500 rounded-lg p-4 transition-colors';
                textarea.style.minHeight = '220px';
                textarea.placeholder = 'Redacta el prompt aquí...';
                textarea.setAttribute('aria-label', 'Texto del prompt');
                textarea.dataset.role = 'prompt-text';
                textarea.dataset.field = 'prompt-text';
                textarea.dataset.blockId = block.id;
                textarea.dataset.promptId = prompt.id;
                textarea.value = draft ? draft.text : prompt.text;
                container.appendChild(textarea);

                let descInputRef = null;
                const markDirty = () => this._markPromptDirty(prompt.id, titleInput.value, textarea.value, descInputRef ? descInputRef.value : (prompt.description || ''));
                titleInput.addEventListener('input', markDirty);
                textarea.addEventListener('input', markDirty);

                const descValue = draft && draft.description !== undefined ? draft.description : (prompt.description || '');
                const descWrap = el('div', { class: 'mt-1' });
                const showDescTextarea = (autofocus) => {
                    descWrap.innerHTML = '';
                    const descInput = document.createElement('textarea');
                    descInput.className = 'detail-desc-input';
                    descInput.value = descValue;
                    descInput.placeholder = 'Añade una breve descripción...';
                    descInput.rows = 2;
                    descInput.setAttribute('aria-label', 'Descripción del prompt');
                    descInput.dataset.field = 'prompt-description';
                    descInput.dataset.promptId = prompt.id;
                    descInput.addEventListener('input', markDirty);
                    descWrap.appendChild(descInput);
                    descInputRef = descInput;
                    if (autofocus) descInput.focus();
                };
                if (descValue) {
                    showDescTextarea(false);
                } else {
                    const addDescBtn = el('button', { type: 'button', class: 'add-description-btn', text: '✚ Añadir descripción' });
                    addDescBtn.addEventListener('click', () => showDescTextarea(true));
                    descWrap.appendChild(addDescBtn);
                }
                titleWrap.appendChild(descWrap);

                const actionsRow = el('div', { class: 'flex gap-2 items-center flex-wrap' });
                const saveBtn = el('button', {
                    type: 'button', class: 'btn-vip px-6 py-2.5 rounded-lg text-sm font-bold uppercase tracking-wide',
                    'data-field': 'save-prompt-btn', 'data-prompt-id': prompt.id, text: 'Guardar'
                });
                const doSave = () => this._savePrompt(block.id, prompt.id, titleInput.value, textarea.value, descInputRef ? descInputRef.value : (prompt.description || ''));
                saveBtn.addEventListener('click', doSave);
                titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSave(); } });
                textarea.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doSave(); } });

                const copyBtn = el('button', { type: 'button', class: 'btn-dark px-6 py-2.5 rounded-lg text-sm font-bold uppercase tracking-wide', text: 'Copiar' });
                copyBtn.addEventListener('click', () => this._copyPromptText(block.id, prompt.id, copyBtn));
                actionsRow.append(saveBtn, copyBtn);
                if (isDirty) actionsRow.appendChild(el('span', { class: 'prompt-dirty-label', text: '● Cambios sin guardar' }));
                container.appendChild(actionsRow);

                const mediaGrid = el('div', { class: 'media-slots-grid' });
                mediaGrid.appendChild(this._buildMediaSlot(block, prompt, 'before', 'Antes'));
                mediaGrid.appendChild(this._buildMediaSlot(block, prompt, 'after', 'Después'));
                container.appendChild(mediaGrid);

                const dangerRow = el('div', { class: 'pt-4 mt-2 border-t border-[#1c1c1c] flex justify-start' });
                const deleteBtn = el('button', { type: 'button', class: 'btn-danger px-6 py-2.5 rounded-lg text-sm font-bold uppercase tracking-wide', text: 'Eliminar' });
                deleteBtn.addEventListener('click', () => this._confirmAndRun('⚠️ ¿Eliminar este prompt?', () => {
                    this.dirtyPrompts.delete(prompt.id);
                    this.backToBlock();
                    this.store.deletePrompt(block.id, prompt.id);
                }));
                dangerRow.appendChild(deleteBtn);
                container.appendChild(dangerRow);

                return container;
            }

            _buildMediaSlot(block, prompt, slot, label) {
                const mediaId = slot === 'after' ? prompt.mediaAfterId : prompt.mediaBeforeId;
                const mediaType = slot === 'after' ? prompt.mediaAfterType : prompt.mediaBeforeType;
                const wrap = el('div', { class: 'media-slot' });
                wrap.appendChild(el('span', { class: 'media-slot-label', text: label }));

                if (mediaId) {
                    const mediaWrap = el('div', { class: 'relative rounded-lg overflow-hidden border border-[#333] group/media bg-black' });
                    let mediaEl;
                    if (mediaType === 'video') {
                        mediaEl = document.createElement('video');
                        mediaEl.controls = true;
                        mediaEl.className = 'w-full max-h-48 object-contain';
                        mediaEl.setAttribute('aria-label', label + ': vídeo adjunto');
                    } else {
                        mediaEl = document.createElement('img');
                        mediaEl.className = 'w-full h-40 object-cover opacity-80 group-hover/media:opacity-100 transition duration-300 cursor-pointer';
                        mediaEl.alt = label + ': imagen adjunta';
                        mediaEl.tabIndex = 0;
                        mediaEl.setAttribute('role', 'button');
                        mediaEl.setAttribute('aria-label', 'Ver imagen a tamaño completo');
                        mediaEl.addEventListener('click', () => this.lightbox.open(mediaId));
                        mediaEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.lightbox.open(mediaId); } });
                    }
                    this.mediaUrlManager.getUrl(mediaId).then(url => { if (url) mediaEl.src = url; });

                    const delBtn = el('button', {
                        type: 'button', class: 'absolute top-2 right-2 bg-red-600 text-white w-7 h-7 flex items-center justify-center rounded-full opacity-0 group-hover/media:opacity-100 focus:opacity-100 transition-opacity shadow-lg text-xs z-10',
                        'aria-label': 'Eliminar ' + label.toLowerCase(), text: '✕'
                    });
                    delBtn.addEventListener('click', () => this.store.removeMedia(block.id, prompt.id, slot));
                    mediaWrap.append(mediaEl, delBtn);
                    wrap.appendChild(mediaWrap);
                } else {
                    const zone = el('label', { class: 'media-dropzone' });
                    zone.appendChild(el('span', { 'aria-hidden': 'true', text: '+' }));
                    zone.appendChild(document.createTextNode(' Arrastra o sube — ' + label.toLowerCase()));
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*,video/*';
                    input.className = 'hidden';
                    input.setAttribute('aria-label', 'Añadir imagen o vídeo — ' + label);
                    input.dataset.action = 'add-media';
                    input.dataset.blockId = block.id;
                    input.dataset.promptId = prompt.id;
                    input.dataset.slot = slot;
                    zone.appendChild(input);
                    wireFileDropzone(zone, (file) => this._handleMediaFile(block.id, prompt.id, slot, file));
                    wrap.appendChild(zone);
                }
                return wrap;
            }

            /* ---------- Acciones ---------- */

            async _addBlock() {
                const id = await this.store.addBlock();
                if (id) this.openBlock(id);
            }

            async _addPrompt(blockId) {
                const id = await this.store.addPrompt(blockId);
                if (!id) return;
                this.openPrompt(blockId, id);
                const titleInput = this.detailBody.querySelector('input[data-field="prompt-title"][data-prompt-id="' + id + '"]');
                if (titleInput) titleInput.focus();
            }

            async _addNote() {
                const id = await this.store.addNote();
                if (!id) return;
                this.openNote(id);
                const titleInput = this.detailBody.querySelector('input[data-field="name"][data-note-id="' + id + '"]');
                if (titleInput) titleInput.focus();
            }

            _onDetailChange(e) {
                if (e.target.matches('[data-action="add-media"]')) {
                    const input = e.target;
                    const file = input.files[0];
                    if (!file) return;
                    this._handleMediaFile(input.dataset.blockId, input.dataset.promptId, input.dataset.slot, file);
                    input.value = '';
                    return;
                }
                if (e.target.matches('[data-action="add-note-media"]')) {
                    const input = e.target;
                    const file = input.files[0];
                    if (!file) return;
                    this._handleNoteMediaFile(input.dataset.noteId, file);
                    input.value = '';
                }
            }

            async _handleMediaFile(blockId, promptId, slot, file) {
                if (!/^image\/|^video\//.test(file.type)) {
                    Toast.show('Formato no soportado. Usa una imagen o un vídeo.', 'error');
                    return;
                }
                if (file.size > 60 * 1024 * 1024) {
                    Toast.show('Archivo demasiado grande (máx. 60MB).', 'error');
                    return;
                }
                try {
                    await this.store.setMedia(blockId, promptId, slot, file);
                } catch (err) {
                    console.error(err);
                    Toast.show('No se pudo guardar el archivo multimedia.', 'error');
                }
            }

            async _handleNoteMediaFile(noteId, file) {
                if (!/^image\/|^video\//.test(file.type)) {
                    Toast.show('Formato no soportado. Usa una imagen o un vídeo.', 'error');
                    return;
                }
                if (file.size > 60 * 1024 * 1024) {
                    Toast.show('Archivo demasiado grande (máx. 60MB).', 'error');
                    return;
                }
                try {
                    await this.store.setNoteMedia(noteId, file);
                } catch (err) {
                    console.error(err);
                    Toast.show('No se pudo guardar el archivo multimedia.', 'error');
                }
            }

            async _handleCoverFile(blockId, promptId, file) {
                if (!file.type.startsWith('image/')) {
                    Toast.show('La portada debe ser una imagen.', 'error');
                    return;
                }
                if (file.size > 60 * 1024 * 1024) {
                    Toast.show('Archivo demasiado grande (máx. 60MB).', 'error');
                    return;
                }
                try {
                    await this.store.setPromptCoverMedia(blockId, promptId, file);
                } catch (err) {
                    console.error(err);
                    Toast.show('No se pudo guardar la portada.', 'error');
                }
            }

            // El título, el texto y la descripción del prompt NO se autoguardan al escribir: solo
            // quedan como borrador en memoria (dirtyPrompts) hasta que el usuario pulsa "Guardar".
            _markPromptDirty(promptId, title, text, description) {
                this.dirtyPrompts.set(promptId, { title, text, description });
                const saveBtn = this.detailBody.querySelector('[data-field="save-prompt-btn"][data-prompt-id="' + promptId + '"]');
                if (saveBtn) {
                    const actionsRow = saveBtn.parentElement;
                    if (actionsRow && !actionsRow.querySelector('.prompt-dirty-label')) {
                        actionsRow.appendChild(el('span', { class: 'prompt-dirty-label', text: '● Cambios sin guardar' }));
                    }
                }
            }

            async _savePrompt(blockId, promptId, title, text, description) {
                // Se borra el borrador ANTES de guardar: store.savePromptContent emite 'change'
                // de forma síncrona dentro del await, lo que dispara un redibujado inmediato —
                // así esa ficha ya aparece limpia en cuanto se guarda.
                this.dirtyPrompts.delete(promptId);
                try {
                    await this.store.savePromptContent(blockId, promptId, title, text, description);
                    Toast.show('Prompt guardado.');
                } catch (err) {
                    console.error(err);
                    Toast.show('No se pudo guardar el prompt.', 'error');
                    this.dirtyPrompts.set(promptId, { title, text, description }); // conserva el borrador si falla
                    this.renderDetail(false);
                }
            }

            // Copia el texto del prompt sin necesidad de entrar en él (se usa tanto desde la
            // lista de prompts del bloque como desde la ficha de detalle).
            async _copyPromptText(blockId, promptId, btnEl) {
                const prompt = this.store.findPrompt(blockId, promptId);
                if (!prompt || !prompt.text) {
                    Toast.show('Este prompt está vacío.', 'error');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(prompt.text);
                    Toast.show('Prompt copiado al portapapeles.');
                    if (btnEl) {
                        btnEl.style.transform = 'scale(0.9)';
                        setTimeout(() => { btnEl.style.transform = ''; }, 150);
                    }
                } catch (err) {
                    Toast.show('No se pudo copiar el texto automáticamente.', 'error');
                }
            }

            async _exportData() {
                try {
                    const snapshot = await this.store.exportSnapshot();
                    const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Elite_Prompts_Backup_' + new Date().toISOString().split('T')[0] + '.json';
                    a.click();
                    URL.revokeObjectURL(url);
                    Toast.show('Backup exportado correctamente.');
                } catch (err) {
                    console.error(err);
                    Toast.show('Error al generar el backup.', 'error');
                }
            }

            _importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        await this.store.importData(data);
                        Toast.show('Datos importados correctamente.');
                    } catch (err) {
                        console.error(err);
                        Toast.show('Error crítico leyendo el paquete de datos.', 'error');
                    }
                };
                reader.onerror = () => Toast.show('No se pudo leer el archivo.', 'error');
                reader.readAsText(file);
                e.target.value = '';
            }
        }

        const app = new App();
        app.init();
    })();
    </script>
</body>
</html>
